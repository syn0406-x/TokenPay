name: 每日同步更新

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/LightCountry/TokenPay.git
          git fetch upstream

      # =========================
      # 1. upstream hash
      # =========================
      - name: Get upstream hash
        id: upstream
        run: |
          echo "hash=$(git rev-parse upstream/master)" >> $GITHUB_OUTPUT

      # =========================
      # 2. load last sync hash
      # =========================
      - name: Load state
        id: state
        run: |
          FILE=".last_sync"
          if [ -f "$FILE" ]; then
            echo "last=$(cat $FILE)" >> $GITHUB_OUTPUT
          else
            echo "last=none" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 3. skip if no change (关键优化)
      # =========================
      - name: Check change
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.hash }}" = "${{ steps.state.outputs.last }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 4. get upstream tag
      # =========================
      - name: Get version
        if: steps.check.outputs.changed == 'true'
        id: ver
        run: |
          TAG=$(git describe --tags upstream/master 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # =========================
      # 5. sync files
      # =========================
      - name: Sync upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          git checkout upstream/master -- src || true
          git checkout upstream/master -- Plugs || true
          git checkout upstream/master -- .gitignore || true
          git checkout upstream/master -- LICENSE.txt || true
          git checkout upstream/master -- .gitattributes || true

      # =========================
      # 6. commit only if diff exists
      # =========================
      - name: Commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "sync upstream ${{ steps.ver.outputs.tag }}"

      # =========================
      # 7. update state hash（关键）
      # =========================
      - name: Save state
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.hash }}" > .last_sync

      # =========================
      # 8. push trigger docker
      # =========================
      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin pay
