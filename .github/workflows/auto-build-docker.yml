name: Auto Build Docker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        run: echo "IMAGE_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Check upstream LightCountry/TokenPay for new version
        id: check
        run: |
          UPSTREAM="LightCountry/TokenPay"

          # 获取上游最新版本号（优先取 release，没有则取最新 tag）
          LATEST=$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name' 2>/dev/null || \
                   gh api "repos/${UPSTREAM}/tags" --jq '.[0].name' 2>/dev/null)

          if [ -z "$LATEST" ]; then
            echo "获取上游版本失败"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Upstream latest: $LATEST"

          # 是否已经构建过（通过标记 tag 来判断）
          if git show-ref --quiet "refs/tags/docker-${LATEST}"; then
            echo "$LATEST already built, skip"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New version: $LATEST"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up QEMU
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mark version as built
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "docker-${{ steps.check.outputs.version }}"
          git push origin "docker-${{ steps.check.outputs.version }}"
